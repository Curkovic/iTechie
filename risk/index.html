<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>RIZIK // Hrvatska — iTechie.eu</title>
<meta name="description" content="Rizik on a map of Croatia: start from Zadar, conquer all 21 counties against bots." />
<meta name="theme-color" content="#07080a" />
<link rel="icon" href="/favicon.ico" />
<style>
@font-face{font-family:"Orbitron";font-weight:900;font-display:swap;src:url("/fonts/orbitron-latin-900-normal.woff2") format("woff2")}
@font-face{font-family:"Orbitron";font-weight:700;font-display:swap;src:url("/fonts/orbitron-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Rajdhani";font-weight:600;font-display:swap;src:url("/fonts/rajdhani-latin-600-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Rajdhani";font-weight:600;font-display:swap;src:url("/fonts/rajdhani-latin-ext-600-normal.woff2") format("woff2");unicode-range:U+0100-02BA,U+1E00-1E9F}
@font-face{font-family:"Rajdhani";font-weight:700;font-display:swap;src:url("/fonts/rajdhani-latin-700-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Rajdhani";font-weight:700;font-display:swap;src:url("/fonts/rajdhani-latin-ext-700-normal.woff2") format("woff2");unicode-range:U+0100-02BA,U+1E00-1E9F}
@font-face{font-family:"Fira Code";font-weight:400;font-display:swap;src:url("/fonts/fira-code-latin-400-normal.woff2") format("woff2")}
:root{--bg:#07080a;--panel:#0b1013;--line:#16343a;--cy:#00f0ff;--yl:#ffd23f;--rd:#ff4d5e;--tx:#cfe9ec;--mu:#6f8d92}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:600 16px/1.35 "Rajdhani",system-ui,sans-serif}
a{color:var(--cy);text-decoration:none}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line)}
header h1{margin:0;font:900 22px "Orbitron",sans-serif;letter-spacing:.12em;color:var(--cy);text-shadow:0 0 12px rgba(0,240,255,.45)}
header h1 small{font:700 12px "Orbitron";color:var(--mu);letter-spacing:.2em;margin-left:8px}
header .sp{flex:1}
header button{font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;height:calc(100vh - 53px)}
#mapwrap{position:relative;overflow:hidden;border-right:1px solid var(--line);background:radial-gradient(ellipse at 40% 60%,#0a1a1e 0%,#07080a 70%)}
#map{width:100%;height:100%;display:block;user-select:none}
aside{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
.box{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:rgba(0,240,255,.02)}
.box h3{margin:0 0 8px;font:700 11px "Orbitron";letter-spacing:.18em;color:var(--mu);text-transform:uppercase}
button{font:700 14px "Rajdhani";letter-spacing:.06em;text-transform:uppercase;color:var(--cy);background:transparent;border:1px solid var(--cy);border-radius:4px;padding:6px 12px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){background:rgba(0,240,255,.12);box-shadow:0 0 10px rgba(0,240,255,.35)}
button:disabled{opacity:.35;cursor:default}
button.warn{color:var(--yl);border-color:var(--yl)}
button.red{color:var(--rd);border-color:var(--rd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pl{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:15px}
.pl.dead{opacity:.35;text-decoration:line-through}
.pl.cur{font-weight:700}
.pl .em{width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center}
.pl .em svg{width:16px;height:16px}
.pl .st{margin-left:auto;font:400 12px "Fira Code";color:var(--mu)}
.pl .arrow{width:10px;color:var(--yl)}
#phase{font:900 15px "Orbitron";letter-spacing:.1em}
#hint{color:var(--mu);font-size:14px;margin-top:4px;min-height:19px}
.phases{display:flex;gap:4px;margin:8px 0 2px}
.phases span{flex:1;text-align:center;font:700 10px "Orbitron";letter-spacing:.1em;padding:4px 0;border:1px solid var(--line);border-radius:3px;color:var(--mu)}
.phases span.on{color:var(--bg);background:var(--cy);border-color:var(--cy)}
#cards{display:flex;gap:6px;flex-wrap:wrap}
.card{width:56px;height:76px;border:1px solid var(--line);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px;cursor:pointer;font-size:11px;text-align:center;line-height:1.05;color:var(--tx)}
.card svg{width:26px;height:26px;color:var(--yl)}
.card.sel{border-color:var(--yl);box-shadow:0 0 8px rgba(255,210,63,.5)}
.card.own{color:var(--cy)}
#log{font:400 12px/1.5 "Fira Code";max-height:200px;overflow-y:auto;color:var(--mu)}
#log div b{font-weight:400}
.dice{display:flex;gap:6px;align-items:center;min-height:38px}
.die{width:32px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;font:700 18px "Orbitron";border:1.5px solid}
.die.a{color:var(--rd);border-color:var(--rd)}
.die.d{color:var(--cy);border-color:var(--cy)}
.die.lost{opacity:.35}
.vs{color:var(--mu);font-size:12px;margin:0 4px}
input[type=range]{width:100%;accent-color:var(--cy)}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,6,8,.78);z-index:5}
.modal .in{background:var(--panel);border:1px solid var(--cy);border-radius:8px;padding:22px 26px;max-width:520px;width:92%;box-shadow:0 0 30px rgba(0,240,255,.15)}
.modal h2{margin:0 0 6px;font:900 24px "Orbitron";letter-spacing:.12em;color:var(--cy)}
.modal p{color:var(--mu);margin:6px 0 14px}
.opt{margin:12px 0}
.opt label{display:block;font:700 11px "Orbitron";letter-spacing:.15em;color:var(--mu);margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{color:var(--mu);border-color:var(--line)}
.seg button.on{color:var(--cy);border-color:var(--cy);background:rgba(0,240,255,.1)}
.terr{cursor:pointer;transition:fill-opacity .15s,stroke-width .15s}
.terr:hover{fill-opacity:.55}
.terr.sel{stroke:#fff!important;stroke-width:2.6}
.terr.tgt{stroke:var(--yl)!important;stroke-width:2.6;fill-opacity:.6}
.terr.dim{fill-opacity:.08}
.lbl{font:700 13px "Rajdhani";fill:#cfe9ec;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#07080a;stroke-width:3px}
.badge text{font:900 13px "Orbitron";text-anchor:middle;dominant-baseline:central;fill:#07080a;pointer-events:none}
.badge,.units{pointer-events:none}
#tip{position:absolute;pointer-events:none;background:rgba(7,8,10,.92);border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-size:13px;display:none;z-index:4;white-space:nowrap}
#tip b{color:var(--cy)}
#legend{position:absolute;left:12px;bottom:10px;font:400 11px "Fira Code";color:var(--mu);line-height:1.6}
#legend .r{display:flex;gap:6px;align-items:center}
#legend i{display:inline-block;width:10px;height:10px;border:1px solid;border-radius:2px}
#unitkey{position:absolute;right:12px;bottom:10px;font:400 11px "Fira Code";color:var(--mu);display:flex;gap:12px}
#unitkey span{display:flex;align-items:center;gap:4px}
#unitkey svg{width:16px;height:16px;color:var(--tx)}
.flash{animation:fl .5s}
@keyframes fl{0%{fill-opacity:.9}100%{}}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}#mapwrap{height:78vh;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>

  <h1>RIZIK<small>// HRVATSKA</small></h1>
  <span class="sp"></span>

      <div id="actions" class="row" style="margin-top:8px"></div>

      <h3>Battle</h3>
      <div id="battleTitle" style="margin-bottom:6px"></div>
      <div class="dice" id="dice"></div>
      <div class="row" id="battleBtns" style="margin-top:8px"></div>
    </div>
    <div class="box"><h3>Players</h3><div id="players"></div></div>
    <div class="box"><h3>Your cards <span id="setval" style="float:right;color:var(--yl)"></span></h3><div id="cards"></div><div class="row" style="margin-top:8px"><button id="btnTrade" disabled>Trade set</button><span id="cardHint" style="font-size:13px;color:var(--mu)"></span></div></div>
    <div class="box"><h3>Regions</h3><div id="regions" style="font-size:14px"></div></div>
    <div class="box"><h3>Log</h3><div id="log"></div></div>
  </aside>
</main>

const rnd=n=>Math.floor(Math.random()*n);

let S=null, busy=false, sel=null, tgt=null, cardSel=new Set();

/* ---------------- setup ---------------- */
function newGame(opts){
  const n=opts.rivals;
  const players=[{id:0,name:'You · Zadar',color:COLORS[0],home:HUMAN_HOME,ai:false,alive:true,cards:[]}];
  for(let i=0;i<n;i++) players.push({id:i+1,name:BOT_HOMES[i][1],color:COLORS[i+1],home:BOT_HOMES[i][0],ai:true,alive:true,cards:[]});
  const owner={},troops={};
  IDS.forEach(t=>{owner[t]=-1;troops[t]=0;});
  if(opts.start==='home'){
    IDS.forEach(t=>troops[t]=1+rnd(3));                 // neutral garrisons 1–3
    players.forEach(p=>{owner[p.home]=p.id;troops[p.home]=8;});
  } else {                                              // classic deal: Zadar is always yours
    const rest=shuffle(IDS.filter(t=>t!==HUMAN_HOME));
    owner[HUMAN_HOME]=0;troops[HUMAN_HOME]=1;
    const order=players.map(p=>p.id);
    rest.forEach((t,i)=>{owner[t]=order[(i+1)%order.length];troops[t]=1;});
    const pool=Math.max(8,Math.round(40/players.length));
    players.forEach(p=>{const mine=IDS.filter(t=>owner[t]===p.id);for(let k=0;k<pool;k++)troops[mine[rnd(mine.length)]]++;});
  }
  const deck=shuffle(IDS.map((t,i)=>({t,u:UNITS[i%3]})).concat([{t:null,u:'wild'},{t:null,u:'wild'}]));
  S={players,owner,troops,cur:0,phase:'reinforce',pending:0,conquered:false,fortified:false,sets:0,deck,discard:[],log:[],opts,turnNo:1,winner:null,mustTrade:false,lastDice:null};
  sel=tgt=null;cardSel.clear();
  log(`New game · ${n} rival${n>1?'s':''} · ${opts.start==='home'?'start from home cities':'classic deal'} · difficulty ${opts.diff}`);
  startTurn();
}

/* ---------------- helpers ---------------- */
const P=id=>S.players[id];
const mine=id=>IDS.filter(t=>S.owner[t]===id);
const enemyAdj=(t)=>GEO.T[t].adj.filter(a=>S.owner[a]!==S.owner[t]);
function regionBonus(id){let b=0,names=[];for(const k in REG)if(REG[k].t.every(t=>S.owner[t]===id)){b+=REG[k].bonus;names.push(REG[k].name);}return {b,names};}
function reinforcements(id){const n=mine(id).length;const r=regionBonus(id);return {base:Math.max(3,Math.floor(n/3)),bonus:r.b,names:r.names};}
function setValue(k){return k<SET_VALUES.length?SET_VALUES[k]:15+5*(k-SET_VALUES.length+1);}
function isSet(cards){if(cards.length!==3)return false;const w=cards.filter(c=>c.u==='wild').length;if(w)return true;const u=new Set(cards.map(c=>c.u));return u.size===1||u.size===3;}
function findSet(cards){const n=cards.length;let best=null;for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++){const s=[cards[a],cards[b],cards[c]];if(isSet(s)){const w=s.filter(x=>x.u==='wild').length;if(!best||w<best.w)best={idx:[a,b,c],w};}}return best?best.idx:null;}
function connected(from){const id=S.owner[from];const seen=new Set([from]),q=[from];while(q.length){const t=q.shift();for(const a of GEO.T[t].adj)if(!seen.has(a)&&S.owner[a]===id){seen.add(a);q.push(a);}}seen.delete(from);return seen;}
function unitsOf(n){return {art:Math.floor(n/10),cav:Math.floor((n%10)/5),inf:n%5};}
function log(msg,color){S.log.unshift({msg,color,turn:S.turnNo});if(S.log.length>120)S.log.pop();}
function nm(t){return GEO.T[t].name;}
function save(){try{localStorage.setItem('rizik-save',JSON.stringify(S));}catch(e){}}
function loadSave(){try{const s=localStorage.getItem('rizik-save');return s?JSON.parse(s):null;}catch(e){return null;}}

/* ---------------- turn flow ---------------- */
function startTurn(){
  const p=P(S.cur);
  S.phase='reinforce';S.conquered=false;S.fortified=false;S.lastDice=null;
  const r=reinforcements(p.id);
  S.pending=r.base+r.bonus;
  S.mustTrade=p.cards.length>=5;
  log(`<b style="color:${p.color}">${p.name}</b> · turn ${S.turnNo} · +${r.base}${r.bonus?` +${r.bonus} (${r.names.join(', ')})`:''} troops`);
  sel=tgt=null;cardSel.clear();
  save();render();
  if(p.ai) aiTurn(p);
}
function endTurn(){
  const p=P(S.cur);
  if(S.conquered){const c=draw();if(c){p.cards.push(c);if(!p.ai)log(`You draw a card: ${c.t?nm(c.t):'wild'} (${c.u})`);}}
  let n=S.cur;do{n=(n+1)%S.players.length;if(n===0)S.turnNo++;}while(!P(n).alive);
  S.cur=n;startTurn();
}
function draw(){if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[];}return S.deck.pop()||null;}
function trade(id,idx){
  const p=P(id);const cs=idx.map(i=>p.cards[i]);
  if(!isSet(cs))return false;
  const v=setValue(S.sets++);S.pending+=v;
  let extra=[];
  for(const c of cs) if(c.t&&S.owner[c.t]===id&&!extra.includes(c.t)){S.troops[c.t]+=2;extra.push(c.t);}
  p.cards=p.cards.filter((_,i)=>!idx.includes(i));S.discard.push(...cs);
  S.mustTrade=p.cards.length>=5;
  log(`<b style="color:${p.color}">${p.name}</b> trades a set for +${v}${extra.length?` (+2 on ${extra.map(nm).join(', ')})`:''}`);
  return true;
}
function place(t,n){S.troops[t]+=n;S.pending-=n;}
function roll(k){return Array.from({length:k},()=>1+rnd(6)).sort((a,b)=>b-a);}
function battle(from,to,ad){
  const dd=Math.min(2,S.troops[to]);
  const a=roll(ad),d=roll(dd);let al=0,dl=0;
  for(let i=0;i<Math.min(a.length,d.length);i++){if(a[i]>d[i])dl++;else al++;}
  S.troops[from]-=al;S.troops[to]-=dl;
  S.lastDice={a,d,al,dl,from,to};
  return S.troops[to]===0;
}
function conquer(from,to,move){
  const att=S.owner[from],def=S.owner[to];
  S.owner[to]=att;S.troops[to]=move;S.troops[from]-=move;S.conquered=true;
  const p=P(att);
  log(`<b style="color:${p.color}">${p.name}</b> takes ${nm(to)}${def>=0?` from ${P(def).name}`:''}`);
  if(def>=0&&mine(def).length===0){
    const d=P(def);d.alive=false;
    p.cards.push(...d.cards);const got=d.cards.length;d.cards=[];
    log(`☠ ${d.name} is eliminated${got?` · ${p.name} takes ${got} card${got>1?'s':''}`:''}`,'#ff4d5e');
    if(def===0){S.winner=att;S.phase='over';log(`Zadar has fallen. ${p.name} wins.`,'#ff4d5e');}
    else if(S.players.filter(x=>x.alive).length===1){S.winner=att;S.phase='over';log(`🏆 ${p.name} rules Croatia`,'#ffd23f');}
    else if(p.cards.length>=6){S.mustTrade=true;S.phase='reinforce';S.resume='attack';}
  }
}

/* ---------------- AI ---------------- */
const delay=()=>+$('#speed').value;
async function aiTurn(p){
  busy=true;render();
  const D={easy:{ratio:1.9,min:4},normal:{ratio:1.35,min:3},hard:{ratio:1.1,min:3}}[S.opts.diff];
  await sleep(delay());
  // trade
  let s;while((s=findSet(p.cards))&&(p.cards.length>=5||S.opts.diff!=='easy'))trade(p.id,s);
  // deploy: pick the front with the best score
  aiDeploy(p,D);render();await sleep(delay());
  // attack
  for(let guard=0;guard<60&&S.phase!=='over';guard++){
    const mv=aiPickAttack(p,D);if(!mv)break;
    sel=mv.from;tgt=mv.to;render();await sleep(delay()*.6);
    let won=false;
    while(S.troops[mv.from]>1&&!won){won=battle(mv.from,mv.to,Math.min(3,S.troops[mv.from]-1));if(S.troops[mv.from]<=Math.max(1,S.troops[mv.to]*0.6)&&!won)break;}
    if(won){
      const used=S.lastDice.a.length,avail=S.troops[mv.from]-1;
      const stillFront=enemyAdj(mv.from).filter(a=>a!==mv.to).length>0;
      const move=stillFront?Math.max(used,Math.ceil(avail*.6)):avail;
      conquer(mv.from,mv.to,Math.min(avail,Math.max(used,move)));
      if(S.mustTrade&&S.resume){let s2;while((s2=findSet(p.cards))&&p.cards.length>=5)trade(p.id,s2);aiDeploy(p,D);S.phase='attack';S.resume=null;S.mustTrade=false;}
    }
    render();await sleep(delay());
  }
  sel=tgt=null;
  if(S.phase==='over'){busy=false;save();render();showWin();return;}
  aiFortify(p);render();await sleep(delay()*.5);
  busy=false;endTurn();
}
function aiDeploy(p,D){
  S.phase='reinforce';
  const own=mine(p.id);
  let best=null,bs=-1e9;
  for(const t of own){
    const en=enemyAdj(t);if(!en.length)continue;
    for(const e of en){
      const reg=REG[REGOF[e]];const have=reg.t.filter(x=>S.owner[x]===p.id).length;
      let sc=(S.troops[t]-S.troops[e])+have/reg.t.length*6+(S.owner[e]===-1?1:0)+(S.owner[e]===0?0.5:0);
      if(sc>bs){bs=sc;best=t;}
    }
  }
  if(!best)best=own[0];
  // keep a third at the most threatened border
  let threat=null,ts=0;
  for(const t of own){const m=Math.max(0,...enemyAdj(t).filter(e=>S.owner[e]>=0).map(e=>S.troops[e]));const sc=m-S.troops[t];if(sc>ts){ts=sc;threat=t;}}
  if(threat&&threat!==best&&S.pending>=3){const k=Math.floor(S.pending/3);place(threat,k);}
  place(best,S.pending);
  S.phase='attack';
}
function aiPickAttack(p,D){
  let best=null,bs=0;
  for(const t of mine(p.id)){
    if(S.troops[t]<D.min)continue;
    for(const e of enemyAdj(t)){
      const r=(S.troops[t]-1)/Math.max(1,S.troops[e]);
      if(r<D.ratio)continue;
      const reg=REG[REGOF[e]];const have=reg.t.filter(x=>S.owner[x]===p.id).length;
      const sc=r+have/reg.t.length*2+(S.owner[e]>=0&&mine(S.owner[e]).length<=2?3:0);
      if(sc>bs){bs=sc;best={from:t,to:e};}
    }

}
function aiFortify(p){
  S.phase='fortify';
  const own=mine(p.id);
  const interior=own.filter(t=>!enemyAdj(t).length&&S.troops[t]>1).sort((a,b)=>S.troops[b]-S.troops[a]);
  for(const src of interior){
    const reach=[...connected(src)].filter(t=>enemyAdj(t).length);
    if(!reach.length)continue;
    reach.sort((a,b)=>threatOf(b)-threatOf(a));
    const n=S.troops[src]-1;S.troops[src]-=n;S.troops[reach[0]]+=n;S.fortified=true;
    log(`<b style="color:${p.color}">${p.name}</b> moves ${n} from ${nm(src)} to ${nm(reach[0])}`);
    return;
  }
}
function threatOf(t){return enemyAdj(t).reduce((s,e)=>s+(S.owner[e]>=0?S.troops[e]:S.troops[e]*.3),0)-S.troops[t];}

/* ---------------- human input ---------------- */
function clickTerr(t,ev){
  if(!S||busy||S.phase==='over')return;
  const p=P(S.cur);if(p.ai)return;
  if(S.phase==='reinforce'){
    if(S.mustTrade){flashHint('You hold 5+ cards — trade a set first.');return;}
    if(S.owner[t]!==p.id){flashHint('Deploy only on your own counties.');return;}
    const n=ev&&ev.shiftKey?S.pending:1;
    place(t,n);
    if(S.pending===0){S.phase=S.resume||'attack';S.resume=null;sel=null;}
    save();render();return;
  }
  if(S.phase==='attack'){
    if(S.owner[t]===p.id){
      if(S.troops[t]<2){flashHint('Need at least 2 troops to attack from here.');return;}
      sel=(sel===t?null:t);tgt=null;render();return;
    }
    if(sel&&GEO.T[sel].adj.includes(t)){tgt=t;render();return;}
    flashHint(sel?'Pick a county bordering '+nm(sel)+'.':'First pick one of your counties.');return;
  }
  if(S.phase==='fortify'){
    if(S.fortified)return;
    if(S.owner[t]!==p.id)return;
    if(!sel){if(S.troops[t]<2){flashHint('Need 2+ troops to move from here.');return;}sel=t;render();return;}
    if(t===sel){sel=null;render();return;}
    if(connected(sel).has(t)){tgt=t;askFortify();return;}
    flashHint('Not connected through your counties.');
  }
}
function flashHint(m){$('#hint').textContent=m;$('#hint').style.color='var(--yl)';setTimeout(()=>{$('#hint').style.color='';},1200);}
function humanAttack(blitz){
  if(!sel||!tgt)return;
  const dice=+($('#diceSel')?.value||3);
  let won=false;
  do{const k=Math.min(dice,S.troops[sel]-1);if(k<1)break;won=battle(sel,tgt,k);}while(blitz&&!won&&S.troops[sel]>1);
  if(won){askMoveIn();}
  else if(S.troops[sel]<2){sel=null;tgt=null;}
  save();render();
}
function askMoveIn(){
  const from=sel,to=tgt,minM=S.lastDice.a.length,maxM=S.troops[from]-1;
  if(minM>=maxM){conquer(from,to,maxM);afterConquest(to);return;}
  modal(`<h2>${nm(to)} taken</h2><p>Move troops in from ${nm(from)} (min ${minM}, leave at least 1 behind).</p>
  <input type="range" id="mv" min="${minM}" max="${maxM}" value="${maxM}"><div class="row" style="justify-content:space-between;margin-top:8px"><span id="mvv" style="font:900 20px Orbitron;color:var(--cy)">${maxM}</span><button id="mvok">Move in</button></div>`);
  $('#mv').oninput=e=>$('#mvv').textContent=e.target.value;
  $('#mvok').onclick=()=>{closeModal();conquer(from,to,+$('#mv').value);afterConquest(to);};
}
function afterConquest(to){
  sel=S.troops[to]>1?to:null;tgt=null;save();render();
  if(S.phase==='over')showWin();
}
function askFortify(){
  const from=sel,to=tgt,maxM=S.troops[from]-1;
  modal(`<h2>Fortify</h2><p>Move troops from ${nm(from)} to ${nm(to)}. One move per turn.</p>
  <input type="range" id="mv" min="1" max="${maxM}" value="${maxM}"><div class="row" style="justify-content:space-between;margin-top:8px"><span id="mvv" style="font:900 20px Orbitron;color:var(--cy)">${maxM}</span><span class="row"><button class="red" id="mvno">Cancel</button><button id="mvok">Move</button></span></div>`);
  $('#mv').oninput=e=>$('#mvv').textContent=e.target.value;
  $('#mvno').onclick=()=>{closeModal();tgt=null;render();};
  $('#mvok').onclick=()=>{const n=+$('#mv').value;S.troops[from]-=n;S.troops[to]+=n;S.fortified=true;log(`You move ${n} from ${nm(from)} to ${nm(to)}`);closeModal();sel=tgt=null;endTurn();};
}

/* ---------------- render ---------------- */
const svg=$('#map');
function buildMap(){
  const {W,H,T,NB}=GEO;
  svg.setAttribute('viewBox',`-20 -10 ${W+40} ${H+20}`);
  let g='<g stroke="#00f0ff" stroke-opacity=".06" stroke-width=".6">';
  for(let x=0;x<=W;x+=50)g+=`<path d="M${x} -10V${H+10}"/>`;
  for(let y=0;y<=H;y+=50)g+=`<path d="M-20 ${y}H${W+20}"/>`;
  g+='</g><g fill="#0d1619" stroke="#1d3a40" stroke-width=".8">';
  for(const k in NB)g+=`<path d="${NB[k]}"/>`;
  g+='</g><g id="sea" stroke="#00f0ff" stroke-opacity=".45" stroke-dasharray="4 5" stroke-width="1.4" fill="none">';
  g+=`<path d="${GEO.SEAP}"/>`;
  g+='</g><g id="terrs">';
  for(const t of IDS)g+=`<path class="terr" id="t-${t}" data-t="${t}" d="${T[t].d}" fill-rule="evenodd"/>`;
  g+='</g><g id="regionlines"></g><line id="atk" stroke="#ffd23f" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ah)" style="display:none"/>';
  g+='<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd23f"/></marker></defs>';
  g+='<g id="cities"></g><g id="labels">';
  for(const t of IDS){const o=T[t];g+=`<text class="lbl" x="${o.lx}" y="${o.ly-24}">${o.name}</text>`;}
  g+='</g><g id="badges"></g>';
  svg.innerHTML=g;
  svg.querySelectorAll('.terr').forEach(el=>{
    el.addEventListener('click',ev=>clickTerr(el.dataset.t,ev));
    el.addEventListener('mousemove',ev=>tip(ev,el.dataset.t));
    el.addEventListener('mouseleave',()=>$('#tip').style.display='none');
  });
  $('#unitkey').innerHTML=['inf:1','cav:5','art:10'].map(x=>{const[u,v]=x.split(':');return `<span><svg><use href="#u-${u}"/></svg>=${v}</span>`;}).join('');
  $('#legend').innerHTML=Object.values(REG).map(r=>`<div class="r">${r.name} <span style="color:var(--yl)">+${r.bonus}</span></div>`).join('');
}
function tip(ev,t){
  if(!S)return;const o=S.owner[t];const r=REG[REGOF[t]];
  const box=$('#mapwrap').getBoundingClientRect();
  const el=$('#tip');el.style.display='block';
  el.style.left=(ev.clientX-box.left+14)+'px';el.style.top=(ev.clientY-box.top+10)+'px';
  el.innerHTML=`<b>${GEO.T[t].full}</b><br>${o<0?'Neutral':P(o).name} · ${S.troops[t]} troops<br><span style="color:var(--mu)">${r.name} (+${r.bonus})</span>`;
}
function colorOf(t){const o=S.owner[t];return o<0?NEUTRAL:P(o).color;}
function render(){
  if(!S)return;
  const p=P(S.cur),human=!p.ai;
  let targets=new Set();
  if(human&&S.phase==='attack'&&sel)GEO.T[sel].adj.filter(a=>S.owner[a]!==p.id).forEach(a=>targets.add(a));
  if(human&&S.phase==='fortify'&&sel&&!S.fortified)connected(sel).forEach(a=>targets.add(a));
  for(const t of IDS){
    const el=$('#t-'+t);const c=colorOf(t);
    el.setAttribute('fill',c);el.setAttribute('fill-opacity',S.owner[t]<0?.18:.3);
    el.setAttribute('stroke',c);el.setAttribute('stroke-width',S.owner[t]<0?.8:1.3);
    el.classList.toggle('sel',sel===t);el.classList.toggle('tgt',tgt===t||targets.has(t));
    el.style.filter=S.owner[t]>=0?`drop-shadow(0 0 3px ${c}66)`:'';
  }
  // badges + unit icons
  let b='';
  for(const t of IDS){
    const o=GEO.T[t],c=colorOf(t),n=S.troops[t],u=unitsOf(n);
    const icons=[];for(let i=0;i<u.art;i++)icons.push('art');for(let i=0;i<u.cav;i++)icons.push('cav');for(let i=0;i<u.inf;i++)icons.push('inf');
    const shown=icons.slice(0,6),w=shown.length*13;
    b+=`<g class="units" color="${c}">`;
    shown.forEach((k,i)=>b+=`<use href="#u-${k}" x="${o.lx-w/2+i*13}" y="${o.ly+14}" width="13" height="13"/>`);
    if(icons.length>6)b+=`<text x="${o.lx+w/2+3}" y="${o.ly+24}" style="font:700 10px Rajdhani;fill:${c}">+</text>`;
    b+=`</g><g class="badge"><circle cx="${o.lx}" cy="${o.ly}" r="${n>99?15:12.5}" fill="${c}" stroke="#07080a" stroke-width="2"/><text x="${o.lx}" y="${o.ly+.5}">${n}</text></g>`;
  }
  $('#badges').innerHTML=b;
  // home cities
  let cs='';
  S.players.forEach(pl=>{const o=GEO.T[pl.home];if(!o.city)return;const [x,y]=o.city;const held=S.owner[pl.home]===pl.id;
    cs+=`<g color="${held?pl.color:'#56656b'}"><use href="#u-star" x="${x-7}" y="${y-7}" width="14" height="14"/></g>`;});
  $('#cities').innerHTML=cs;
  // attack arrow
  const atk=$('#atk');
  if(sel&&tgt&&S.phase==='attack'){const A=GEO.T[sel],B=GEO.T[tgt];const dx=B.lx-A.lx,dy=B.ly-A.ly,L=Math.hypot(dx,dy)||1;
    atk.setAttribute('x1',A.lx+dx/L*16);atk.setAttribute('y1',A.ly+dy/L*16);atk.setAttribute('x2',B.lx-dx/L*18);atk.setAttribute('y2',B.ly-dy/L*18);atk.style.display='';}
  else atk.style.display='none';
  // phase panel
  $('#phase').innerHTML=S.phase==='over'?`<span style="color:var(--yl)">GAME OVER</span>`:`<span style="color:${p.color}">${p.name}</span>`;
  document.querySelectorAll('.phases span').forEach(s=>s.classList.toggle('on',s.dataset.p===S.phase));
  let hint='',acts='';
  if(S.phase==='over'){hint=`${P(S.winner).name} rules Croatia.`;acts='<button onclick="setup()">Play again</button>';}
  else if(!human){hint=busy?'Thinking…':'';}
  else if(S.phase==='reinforce'){hint=S.mustTrade?'5+ cards: trade a set before deploying.':`Deploy ${S.pending} troop${S.pending!==1?'s':''}. Click your county (+1), Shift-click for all.`;}
  else if(S.phase==='attack'){hint=!sel?'Pick one of your counties to attack from.':!tgt?`Attacking from ${nm(sel)} — pick a highlighted target.`:`${nm(sel)} (${S.troops[sel]}) → ${nm(tgt)} (${S.troops[tgt]})`;acts='<button class="warn" onclick="toFortify()">End attacks</button>';}
  else if(S.phase==='fortify'){hint=!sel?'Optional: pick a county to move troops from, or end your turn.':'Pick a connected county to move troops to.';acts='<button class="warn" onclick="humanEnd()">End turn</button>';}
  $('#hint').textContent=hint;$('#actions').innerHTML=acts;
  // battle box
  const bb=$('#battle');
  const showBattle=(S.phase==='attack'&&sel&&tgt)||(S.lastDice&&!human);
  bb.style.display=showBattle||S.lastDice?'':'none';
  if(S.lastDice){const d=S.lastDice;
    $('#dice').innerHTML=d.a.map((v,i)=>`<div class="die a ${i<d.d.length&&v<=d.d[i]?'lost':''}">${v}</div>`).join('')+'<span class="vs">vs</span>'+d.d.map((v,i)=>`<div class="die d ${i<d.a.length&&d.a[i]>v?'lost':''}">${v}</div>`).join('')+`<span class="vs">−${d.al} / −${d.dl}</span>`;}
  else $('#dice').innerHTML='';
  if(human&&S.phase==='attack'&&sel&&tgt){
    const maxD=Math.min(3,S.troops[sel]-1);
    $('#battleTitle').innerHTML=`<span style="color:${p.color}">${nm(sel)} ${S.troops[sel]}</span> → <span style="color:${colorOf(tgt)}">${nm(tgt)} ${S.troops[tgt]}</span>`;
    $('#battleBtns').innerHTML=`<select id="diceSel" style="background:var(--bg);color:var(--tx);border:1px solid var(--line);font:600 14px Rajdhani;padding:5px">${[1,2,3].filter(k=>k<=maxD).map(k=>`<option ${k===maxD?'selected':''} value="${k}">${k} dice</option>`).join('')}</select><button onclick="humanAttack(false)">Roll</button><button class="red" onclick="humanAttack(true)">Blitz</button><button class="warn" onclick="tgt=null;render()">Stop</button>`;
  } else {$('#battleTitle').innerHTML=S.lastDice?`${nm(S.lastDice.from)} → ${nm(S.lastDice.to)}`:'';$('#battleBtns').innerHTML='';}
  // players
  $('#players').innerHTML=S.players.map(pl=>{const n=mine(pl.id).length,tr=mine(pl.id).reduce((s,t)=>s+S.troops[t],0);
    return `<div class="pl ${pl.alive?'':'dead'} ${pl.id===S.cur?'cur':''}" style="color:${pl.color}"><span class="arrow">${pl.id===S.cur&&S.phase!=='over'?'▶':''}</span><span class="em"><svg><use href="#u-${pl.ai?['art','cav','inf'][pl.id%3]:'inf'}"/></svg></span>${pl.name}<span class="st">${n} cty · ${tr} trp · ${pl.cards.length} crd</span></div>`;}).join('')+`<div class="pl" style="color:${NEUTRAL}"><span class="arrow"></span><span class="em"></span>Neutral<span class="st">${mine(-1).length} cty</span></div>`;
  // cards
  const me=P(0);
  $('#cards').innerHTML=me.cards.length?me.cards.map((c,i)=>`<div class="card ${cardSel.has(i)?'sel':''} ${c.t&&S.owner[c.t]===0?'own':''}" onclick="toggleCard(${i})"><svg><use href="#u-${c.u}"/></svg><span>${c.t?nm(c.t):'Wild'}</span></div>`).join(''):'<span style="color:var(--mu);font-size:13px">Conquer a county to draw a card.</span>';
  $('#setval').textContent='next set +'+setValue(S.sets);
  const canTrade=!S.players[S.cur].ai&&S.cur===0&&S.phase==='reinforce'&&cardSel.size===3&&isSet([...cardSel].map(i=>me.cards[i]));
  $('#btnTrade').disabled=!canTrade;
  $('#cardHint').textContent=S.cur===0&&S.phase==='reinforce'?(findSet(me.cards)?'Pick 3: same unit or one of each':''):'Trade during deploy';
  // regions
  $('#regions').innerHTML=Object.values(REG).map(r=>{const own=r.t.map(t=>S.owner[t]);const all=own.every(o=>o===own[0]&&o>=0);
    return `<div class="row" style="justify-content:space-between"><span>${r.name} <span style="color:var(--yl)">+${r.bonus}</span></span><span style="display:flex;gap:3px">${r.t.map(t=>`<i title="${nm(t)}" style="width:10px;height:10px;border-radius:2px;background:${colorOf(t)};opacity:${S.owner[t]<0?.4:1}"></i>`).join('')}</span>${all?`<span style="color:${P(own[0]).color};font-size:12px">✓</span>`:''}</div>`;}).join('');
  // log
  $('#log').innerHTML=S.log.slice(0,60).map(l=>`<div style="${l.color?`color:${l.color}`:''}">${l.msg}</div>`).join('');
}
function toggleCard(i){if(cardSel.has(i))cardSel.delete(i);else if(cardSel.size<3)cardSel.add(i);render();}
$('#btnTrade').onclick=()=>{if(trade(0,[...cardSel])){cardSel.clear();save();render();}};
function toFortify(){S.phase='fortify';sel=tgt=null;save();render();}
function humanEnd(){sel=tgt=null;endTurn();}

/* ---------------- modals ---------------- */
function modal(html){$('#modalIn').innerHTML=html;$('#modal').style.display='flex';}
function closeModal(){$('#modal').style.display='none';}
function showWin(){const w=P(S.winner);modal(`<h2 style="color:${w.color}">${w.ai?'Defeat':'Victory'}</h2><p>${w.ai?`${w.name} conquered Croatia. Zadar will rise again.`:'Croatia is yours — from Zadar to Vukovar.'} (${S.turnNo} rounds)</p><button onclick="setup()">New game</button>`);}
function setup(){
  const sv=loadSave();
  const o={rivals:3,start:'home',diff:'normal'};
  const seg=(key,vals)=>`<div class="seg" data-k="${key}">${vals.map(([v,l])=>`<button data-v="${v}" class="${String(o[key])===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
  modal(`<h2>RIZIK</h2><p>Croatia, 21 counties. You march out of <b style="color:var(--cy)">Zadar</b>. Last commander standing wins.</p>
  <div class="opt"><label>Rivals</label>${seg('rivals',[[1,'1 · Zagreb'],[2,'2 · +Split'],[3,'3 · +Osijek'],[4,'4 · +Rijeka'],[5,'5 · +Dubrovnik']])}</div>
  <div class="opt"><label>Start</label>${seg('start',[['home','From home cities'],['deal','Classic deal']])}</div>
  <div class="opt"><label>Difficulty</label>${seg('diff',[['easy','Easy'],['normal','Normal'],['hard','Hard']])}</div>
  <div class="row" style="margin-top:18px;justify-content:flex-end">${sv&&sv.phase!=='over'?'<button class="warn" id="cont">Continue saved</button>':''}<button id="go">Start</button></div>
  <p style="font-size:13px;margin-top:14px">Rules: deploy max(3, counties÷3) + region bonuses · attacker rolls up to 3 dice, defender 2, ties go to defender · conquer a county → draw a card · sets of 3 (same unit or one of each) give 4, 6, 8, 10, 12, 15, +5… and +2 on a county you own · one fortify move per turn.</p>`);
  document.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{sg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const k=sg.dataset.k;o[k]=k==='rivals'?+b.dataset.v:b.dataset.v;}));
  $('#go').onclick=()=>{closeModal();newGame(o);};
  if($('#cont'))$('#cont').onclick=()=>{closeModal();S=sv;sel=tgt=null;busy=false;render();if(P(S.cur).ai)aiTurn(P(S.cur));};
}
$('#btnNew').onclick=()=>{if(!busy)setup();};
buildMap();setup();
</script>
</body>
</html>
